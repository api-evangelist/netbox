          format: uri
          readOnly: true
        display:
          type: string
          readOnly: true
        parent:
          allOf:
          - $ref: '#/components/schemas/NestedPlatform'
          nullable: true
        name:
          type: string
          maxLength: 100
        slug:
          type: string
          maxLength: 100
          pattern: ^[-a-zA-Z0-9_]+$
        manufacturer:
