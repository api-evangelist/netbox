      properties:
        object_type:
          type: string
        object_id:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        user:
          oneOf:
          - type: integer
          - $ref: '#/components/schemas/BriefUserRequest'
      required:
      - object_id
      - object_type
      - user
    Platform:
      type: object
      description: Base serializer class for models inheriting from NestedGroupModel.
