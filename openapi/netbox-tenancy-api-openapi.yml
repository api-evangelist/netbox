components:
  schemas:
    TenantRequest:
      type: object
      description: Base serializer class for models inheriting from PrimaryModel.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        slug:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^[-a-zA-Z0-9_]+$
        group:
          oneOf:
          - type: integer
          - allOf:
            - $ref: '#/components/schemas/BriefTenantGroupRequest'
        description:
          type: string
          maxLength: 200
        owner:
          oneOf:
          - type: integer
          - allOf:
            - $ref: '#/components/schemas/BriefOwnerRequest'
        comments:
          type: string
        tags:
          type: array
          items:
            $ref: '#/components/schemas/NestedTagRequest'
        custom_fields:
          type: object
          additionalProperties: {}
      required:
      - name
      - slug
    ContactAssignment:
      type: object
      description: Adds support for custom fields and tags.
      properties:
        id:
          type: integer
          readOnly: true
        url:
          type: string
          format: uri
          readOnly: true
        display:
          type: string
          readOnly: true
        object_type:
          type: string
        object_id:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        object:
          readOnly: true
        contact:
          $ref: '#/components/schemas/BriefContact'
        role:
          allOf:
          - $ref: '#/components/schemas/BriefContactRole'
        priority:
          type: object
          properties:
            value:
              enum:
              - primary
              - secondary
              - tertiary
              - inactive
              - ''
              type: string
              description: '* `primary` - Primary

                * `secondary` - Secondary

