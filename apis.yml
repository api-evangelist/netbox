name: NetBox
description: >-
  NetBox is the leading solution for modeling and documenting modern networks. By combining the traditional disciplines
  of IP address management (IPAM) and datacenter infrastructure management (DCIM) with powerful APIs and extensions,
  NetBox provides the ideal "source of truth" to power network automation.
