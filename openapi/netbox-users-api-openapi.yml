        description:
          type: string
          maxLength: 200
        created:
          type: string
          format: date-time
          readOnly: true
        expires:
          type: string
          format: date-time
          nullable: true
        last_used:
          type: string
          format: date-time
          nullable: true
        enabled:
          type: boolean
          description: Disable to temporarily revoke this token without deleting it.
        write_enabled:
          type: boolean
          description: Permit create/update/delete operations using this token
        pepper_id:
          type: integer
          maximum: 32767
          minimum: 0
          nullable: true
          description: ID of the cryptographic pepper used to hash the token (v2 only)
        token:
          type: string
